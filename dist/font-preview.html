<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作业岛 · 字体候选对比</title><style>
@font-face{font-family:Chill;src:url('assets/font-candidates/chill.ttf')}@font-face{font-family:Maiyuan;src:url('assets/font-candidates/maiyuan.ttf')}@font-face{font-family:Kuaile;src:url('assets/font-candidates/kuaile.ttf')}@font-face{font-family:Huangyou;src:url('assets/font-candidates/huangyou.ttf')}
*{box-sizing:border-box}body{margin:0;padding:28px 20px 50px;background:#eef6ef;color:#503b2a;font-family:system-ui,-apple-system,sans-serif}main{max-width:1040px;margin:auto}h1{font-size:24px;margin:0 0 10px}header p{line-height:1.7;font-size:14px;margin:6px 0;color:#637164}a{color:#3f7651}textarea{display:block;width:100%;font:16px system-ui;padding:12px;border:1px solid #c6d8c7;border-radius:12px;margin:16px 0;background:#fffdf6;color:#503b2a;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.candidate{background:#fffdf6;border:1px solid #d7ddcb;border-radius:20px;padding:20px;box-shadow:0 5px 15px #396b3910}.meta{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}.code{display:grid;place-items:center;border-radius:10px;width:34px;height:34px;background:#d6ead8;color:#2c653a}.note{font:13px/1.6 system-ui;color:#6f7768;min-height:42px;margin:10px 0}.sample{font-family:var(--family),sans-serif;font-weight:400;font-synthesis:none;border-radius:16px;background:#fff5df;padding:17px;color:#593b24}.sample h2{font:400 27px/1.35 var(--family),sans-serif;margin:0 0 10px}.body{font-size:18px;line-height:1.7;white-space:pre-wrap;min-height:62px}.small{font-size:14px;margin:12px 0 0;color:#67754a;line-height:1.6}.tabs{font-size:15px;display:flex;justify-content:space-between;border-top:1px solid #e8d9b5;margin-top:16px;padding-top:12px;gap:6px}.foot{font:12px/1.6 system-ui;margin:12px 0 0;color:#697267}.status{font:12px system-ui;color:#5b7858;margin-top:8px}.selected{outline:3px solid #68a562}button{font:14px system-ui;background:#e7f2df;color:#365e30;border:1px solid #b4cda0;border-radius:10px;padding:8px 12px;margin-top:14px;cursor:pointer}.result{padding:12px 0;font-size:14px;min-height:44px}@media(max-width:720px){body{padding:20px 14px}.grid{grid-template-columns:1fr}.candidate{padding:16px}.note{min-height:0}}
</style><main><header><h1>作业岛 · 圆润字体候选</h1><p>四款真实字体，同样文字、同样字号。先挑选，主页面字体暂未替换。</p><p>标题 27px / 正文 18px / 导航 15px；可在下方输入自己的文字对比。</p><textarea aria-label="自定义试字内容" rows="2">数学　练习第3页
语文　朗读《春天来了》</textarea></header><div class="grid" id="grid"></div><div class="result" id="result" aria-live="polite">挑选后把编号告诉我即可。</div><p class="foot">字体取自作者或 Google Fonts 项目仓库，授权文件随样张保存；本页独立加载字体，不影响当前作业岛界面。</p></main><script>
const candidates=[
{id:'A',name:'寒蝉圆黑体',family:'Chill',note:'推荐整页使用 · 轮廓圆润、字形清楚，适合标题、正文和数字。',source:'https://github.com/Warren2060/ChillRoundGothic',weight:'Medium'},
{id:'B',name:'荆南麦圆体',family:'Maiyuan',note:'推荐童趣方向 · 圆头笔画，带轻松手写感，更贴近儿童动漫氛围。',source:'https://github.com/maoken-fonts/KNMaiyuan',weight:'Regular'},
{id:'C',name:'站酷快乐体',family:'Kuaile',note:'活泼夸张 · 字形更有跳跃感，适合游戏标题；小字号正文需仔细比较。',source:'https://github.com/googlefonts/zcool-kuaile',weight:'Regular'},
{id:'D',name:'站酷庆科黄油体',family:'Huangyou',note:'圆润醒目 · 略窄的字形、饱满笔画，标题和按钮更突出。',source:'https://github.com/googlefonts/zcool-qingke-huangyou',weight:'Regular'}];
const grid=document.querySelector('#grid');
for(const f of candidates){const c=document.createElement('section');c.className='candidate';c.dataset.id=f.id;c.style.setProperty('--family',f.family);c.innerHTML=`<div class="meta"><span class="code">${f.id}</span>${f.name}</div><p class="note">${f.note}</p><div class="sample"><h2>今日作业　2/3</h2><div class="body"></div><div class="small">记得携带：泳衣 · 泳帽 · 水杯<br>16:30 游泳课　ABC 123</div><div class="tabs"><span>今日任务</span><span>小岛日程</span><span>我的小岛</span></div></div><p class="foot">${f.weight} · <a href="${f.source}" target="_blank" rel="noopener">字体来源 / OFL 授权</a></p><div class="status">字体加载中…</div><button type="button">我偏好 ${f.id}</button>`;grid.append(c);c.querySelector('button').onclick=()=>{document.querySelectorAll('.candidate').forEach(x=>x.classList.toggle('selected',x===c));document.querySelector('#result').textContent=`已标记 ${f.id} · ${f.name}。请在聊天里确认编号，确认后再替换主页面。`;};document.fonts.load(`18px ${f.family}`,'今日作业数学语文英语').then(()=>{c.querySelector('.status').textContent='真实字体已载入';}).catch(()=>{c.querySelector('.status').textContent='字体加载失败，请刷新后再比较';});}
function update(){document.querySelectorAll('.body').forEach(x=>x.textContent=document.querySelector('textarea').value)}document.querySelector('textarea').addEventListener('input',update);update();
</script></html>
