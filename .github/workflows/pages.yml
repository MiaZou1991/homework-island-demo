name: Publish Homework Island
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Require main branch before automatic release
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          test "$EVENT_REF" = 'refs/heads/main' || { echo 'Only main may deploy'; exit 1; }
          echo "Deploying reviewed main SHA $(git rev-parse HEAD), only after all checks pass."

      - name: Verify settlement and data isolation
        run: |
          node checks/domain.test.cjs
          node checks/companions-v4.cjs
          node checks/kaixin-sync.cjs
          node checks/sync-traffic.cjs
          node checks/realtime-signal.cjs
          node checks/publish-flow.cjs
      - name: Install CJK fonts for visual mobile QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Mobile family calendar QA (320 / 375 / 390 / 430)
        run: |
          npm install --no-save --no-package-lock playwright
          python3 -m http.server 8189 --bind 127.0.0.1 --directory dist >/tmp/kaixin-calendar-server.log 2>&1 &
          node checks/family-schedule.cjs
          node checks/companions-mobile.cjs
      - name: Upload calendar QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-calendar-mobile-qa
          path: /tmp/family-calendar-*.png
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build optimized WebP artwork
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python .github/optimize_artwork.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: build/pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
