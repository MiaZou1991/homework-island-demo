<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作业岛 · UI 素材库</title><style>
@font-face{font-family:IslandRound;src:url('assets/font-candidates/chill.ttf');font-weight:500;font-display:swap}*{box-sizing:border-box}body{font-family:IslandRound,sans-serif;margin:0;background:#eff6e9;color:#65492c;padding:28px 20px}main{max-width:1100px;margin:auto}h1{font-size:27px}p{font-size:14px;line-height:1.8}a{color:#4e803b}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:20px 0}input{font:inherit;min-width:220px;padding:11px;border:1px solid #c7d5b8;border-radius:12px}button{font:inherit;padding:10px 15px;border:1px solid #bed0ac;border-radius:20px;color:#50783a;background:white;cursor:pointer}button[aria-pressed=true]{background:#d6efbc}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{background:#fffdf3;border:1px solid #dedbbf;border-radius:20px;padding:13px;overflow:hidden}.art{height:180px;display:grid;place-items:center;background:repeating-conic-gradient(#f1f0e8 0% 25%,#fffefa 0% 50%) 0/20px 20px;border-radius:12px}.art img{width:100%;height:100%;object-fit:contain;max-height:180px}.card h2{font-size:15px;margin:13px 0 7px}.card p{font-size:12px;margin:4px 0;color:#8f7c5f}.card a{display:inline-block;padding:9px 0;font-size:13px}.font{background:#fff5d8;border:1px solid #e2d7b2;border-radius:18px;padding:18px;margin:20px 0}.font b{font-size:22px}.note{color:#8a775d}.empty{padding:35px;text-align:center}
</style><main><h1>作业岛 · UI 素材库</h1><p>2026.10.28 更新 · 今日任务图标、通用手绘弹窗与自然沙路背景。弹窗标题垂直居中，关闭按钮距面板上、右边缘各 25px。文字、按钮与标题由页面绘制，图片是独立装饰资源。</p><p><a href="child.html?preview=1&design=original">打开儿童端预览</a> · <a href="assets/hd/catalog.json" download>下载素材目录</a></p><div class="font"><b>寒蝉圆黑体 · 已选定 A</b><p>今日作业　数学　小岛日程　我的小岛　16:30</p><a href="assets/font-candidates/chill.ttf" download>下载字体</a> · <a href="assets/font-candidates/chill-OFL.txt" download>授权文件</a></div><nav><button id="new" aria-pressed="true">本次更新</button><button id="all" aria-pressed="false">全部素材</button><input id="search" aria-label="搜索素材" placeholder="搜索名称或文件名"></nav><p id="count" class="note"></p><div id="grid" class="grid"></div></main><script>
let assets=[],featured=true;const grid=document.querySelector('#grid'),query=document.querySelector('#search');function render(){const q=query.value.trim().toLowerCase(),list=assets.filter(x=>(!featured||x.featured)&&(!q||(x.name+' '+x.path).toLowerCase().includes(q)));document.querySelector('#count').textContent=`共 ${list.length} 项 · PNG 保留透明背景，SVG 可无损缩放`;grid.replaceChildren();for(const x of list){const card=document.createElement('article');card.className='card';const art=document.createElement('div');art.className='art';const img=document.createElement('img');img.src=x.src;img.alt=x.name;img.loading='lazy';art.append(img);const h=document.createElement('h2');h.textContent=x.name;const info=document.createElement('p');info.textContent=x.size.join(' × ')+' · '+x.mode;const link=document.createElement('a');link.href=x.src;link.download=x.src.split('/').pop();link.textContent='下载独立素材 ↓';card.append(art,h,info,link);grid.append(card)}if(!list.length)grid.textContent='没有找到匹配的素材。'}for(const [id,value] of [['new',true],['all',false]])document.getElementById(id).onclick=()=>{featured=value;document.getElementById('new').setAttribute('aria-pressed',String(value));document.getElementById('all').setAttribute('aria-pressed',String(!value));render()};query.oninput=render;fetch('assets/hd/catalog.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{assets=d;render()}).catch(()=>document.querySelector('#count').textContent='素材目录暂时加载失败，请刷新。');
</script></html>
