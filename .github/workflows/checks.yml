name: Check Homework Island
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: domain-sync-and-mobile-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify settlement, sync, traffic and data isolation
        run: |
          node checks/domain.test.cjs
          node checks/companions-v7.cjs
          node checks/kaixin-sync.cjs
          node checks/v2-operation-engine.cjs
          node --check dist/kaixin-stage-auth.js
          node --check dist/kaixin-stage-sync.js
          node checks/sync-traffic.cjs
          node checks/realtime-signal.cjs
          node checks/publish-flow.cjs
      - name: Install Playwright for smoke and mobile QA
        run: npm install --no-save --no-package-lock playwright
      - name: Build optimized images and approved UI WOFF2 fonts without publishing
        run: |
          python3 -m pip install --disable-pip-version-check Pillow 'fonttools[woff]'
          python3 .github/optimize_artwork.py
      - name: Cold child page performance smoke (optimized artifact)
        run: |
          python3 -m http.server 8190 --bind 127.0.0.1 --directory build/pages >/tmp/kaixin-pages-perf-server.log 2>&1 &
          node checks/loading-performance.cjs
      - name: Install fonts for mobile rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Mobile family calendar QA (320 / 375 / 390 / 430)
        run: |
          python3 -m http.server 8189 --bind 127.0.0.1 --directory dist >/tmp/kaixin-calendar-server.log 2>&1 &
          node checks/family-schedule.cjs
          node checks/companions-mobile.cjs
      - name: Assemble and browser-test an independent KAIXIN V2 staging site
        run: |
          node checks/build-kaixin-staging.cjs
          python3 -m http.server 8191 --bind 127.0.0.1 --directory build/kaixin-staging >/tmp/kaixin-v2-stage-server.log 2>&1 &
          node checks/kaixin-stage-full-ui.cjs
          cd build && zip -q -r kaixin-staging.zip kaixin-staging
      - name: Publish isolated TEST PACKAGE to CI artifacts only (never Pages)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kaixin-v2-isolated-staging-static-site
          path: build/kaixin-staging.zip
          retention-days: 7
      - name: Upload companion gallery QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-gallery-mobile-qa
          path: /tmp/companions-gallery-*.png
          if-no-files-found: ignore
          retention-days: 3
