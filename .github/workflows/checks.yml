name: Check Homework Island
on:
  pull_request:
    branches: [main, feat/island-explore-stage1-20261109]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: domain-sync-and-mobile-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify settlement, sync, traffic and data isolation
        run: |
          node checks/domain.test.cjs
          node checks/companions-v4.cjs
          node checks/kaixin-sync.cjs
          node checks/sync-traffic.cjs
          node checks/realtime-signal.cjs
          node checks/publish-flow.cjs
          node checks/family-tree-model.cjs
      - name: Install fonts for mobile rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Mobile family calendar QA (320 / 375 / 390 / 430)
        run: |
          npm install --no-save --no-package-lock playwright
          python3 -m http.server 8189 --bind 127.0.0.1 --directory dist >/tmp/kaixin-calendar-server.log 2>&1 &
          node checks/family-schedule.cjs
          node checks/companions-mobile.cjs
          node checks/island-explore.cjs
          node checks/family-tree-mobile.cjs
      - name: Upload companion gallery QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-gallery-mobile-qa
          path: /tmp/companions-gallery-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload island exploration screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-exploration-mobile-qa
          path: /tmp/island-explore-*.png
          if-no-files-found: ignore
          retention-days: 5
      - name: Upload family tree mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-tree-mobile-qa
          path: /tmp/family-tree-*.png
          if-no-files-found: ignore
          retention-days: 5
      - name: Build optimized WebP assets without publishing
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 .github/optimize_artwork.py
