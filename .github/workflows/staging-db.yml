name: Staging Supabase DB Acceptance
# Deliberately manual. Requires four fresh real Auth JWTs and pre-enrolled synthetic QA family.
# MUST NOT run on production or use real child data. Workflow dispatch requires integration to default branch;
# until then use the standalone script with explicit isolated staging secrets after safe review.
on:
  workflow_dispatch:
    inputs:
      run_conflict_test:
        description: "Run isolated staging concurrency overwrite test"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  staging-db:
    name: staging-db-contract
    runs-on: ubuntu-latest
    environment: staging
    env:
      KAIXIN_STAGE_URL: ${{ secrets.KAIXIN_STAGE_URL }}
      KAIXIN_STAGE_KEY: ${{ secrets.KAIXIN_STAGE_KEY }}
      KAIXIN_STAGE_PARENT_A_JWT: ${{ secrets.KAIXIN_STAGE_PARENT_A_JWT }}
      KAIXIN_STAGE_PARENT_B_JWT: ${{ secrets.KAIXIN_STAGE_PARENT_B_JWT }}
      KAIXIN_STAGE_CHILD_JWT: ${{ secrets.KAIXIN_STAGE_CHILD_JWT }}
      KAIXIN_STAGE_OUTSIDER_JWT: ${{ secrets.KAIXIN_STAGE_OUTSIDER_JWT }}
      RUN_CONFLICT_TEST: ${{ inputs.run_conflict_test }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate staging-only database test setup and run contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAIXIN_STAGE_URL" && test -n "$KAIXIN_STAGE_KEY" && test -n "$KAIXIN_STAGE_PARENT_A_JWT" && test -n "$KAIXIN_STAGE_PARENT_B_JWT" && test -n "$KAIXIN_STAGE_CHILD_JWT" && test -n "$KAIXIN_STAGE_OUTSIDER_JWT" || {
            echo "Missing staging-only URL/key or real Auth test JWT secrets. No database call was made."
            exit 2
          }
          args=(--stage)
          if [ "$RUN_CONFLICT_TEST" = "true" ]; then args+=(--conflicts); fi
          node checks/staging-db-sync.cjs "${args[@]}" | tee staging-db-result.json
      - name: Save isolated staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-db-acceptance
          path: staging-db-result.json
          if-no-files-found: ignore
          retention-days: 7
