<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#74c9db">
  <title>我们的岛 · 自由漫步</title>
  <link rel="stylesheet" href="our-island.css?v=20261109-explore3">
</head>
<body>
  <main id="island">
    <canvas id="world" aria-label="我们的岛漫步地图：码头、花园、家庭树、森林书屋和我的小屋；可使用方向键或左下方摇杆行走"></canvas>
    <header id="toolbar">
      <button type="button" id="mapToggle" aria-controls="mapPanel" aria-expanded="false">看看地图</button>
    </header>
    <p id="hint" role="status" aria-live="polite">从码头出发，沿着小路探索吧</p>
    <button type="button" id="visit" hidden>看看码头</button>
    <section id="mapPanel" aria-label="小岛地点导航" hidden>
      <h2>想去哪里看看？</h2>
      <p>点选地点就能抵达附近，也可以关掉地图慢慢走。</p>
      <div class="map-places">
        <button type="button" data-go="pier"><span class="place-dot"></span>码头</button>
        <button type="button" data-go="garden"><span class="place-dot"></span>花园</button>
        <button type="button" data-go="tree"><span class="place-dot"></span>家庭树</button>
        <button type="button" data-go="treehouse"><span class="place-dot"></span>森林书屋</button>
        <button type="button" data-go="house"><span class="place-dot"></span>我的小屋</button>
      </div>
      <button type="button" id="keepWalking">继续慢慢走</button>
    </section>
    <div id="stick" role="group" aria-label="行走摇杆">
      <span class="arrows" aria-hidden="true">↑<br>←　　→<br>↓</span>
      <i id="knob" aria-hidden="true"></i>
    </div>
    <button type="button" id="home">回到码头</button>
    <div id="loading" role="status" aria-live="polite">小岛正在醒来…</div>
    <dialog id="detail" aria-labelledby="detailTitle" aria-describedby="detailDescription">
      <div class="detail-shell">
        <div id="detailScene" class="detail-scene">
          <img id="detailMap" src="assets/our-island-v1/map.webp" alt="">
          <img id="detailTree" src="assets/our-island-v1/tree.webp" alt="" hidden>
          <div id="detailKid" aria-hidden="true" hidden></div>
        </div>
        <div class="detail-copy">
          <h2 id="detailTitle">欢迎来到小岛</h2>
          <p id="detailDescription"></p>
          <p id="detailFuture" class="detail-future"></p>
          <p id="treePreviewState" class="tree-preview-stage" hidden></p>
          <button type="button" id="treeEnter" hidden>进入家庭树 · 看家人的留言</button>
          <button type="button" id="back">返回小路</button>
        </div>
        <button type="button" id="detailClose" aria-label="关闭，回到小路">×</button>
      </div>
    </dialog>
    <dialog id="treeExperience" aria-label="家庭树：成长回忆、家庭便签与爱心">
      <button type="button" id="treeClose" aria-label="关闭家庭树，回到小路">×</button>
      <iframe id="treeFrame" title="家庭树互动空间" data-src="family-tree.html?preview=1"></iframe>
    </dialog>
  </main>
  <script src="our-island.js?v=20261110-family-tree-v21"></script>
</body>
</html>
