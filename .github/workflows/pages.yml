name: Publish Homework Island
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'The exact 40-character SHA currently on main; do not auto-release any other revision'
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Require explicit main release SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          test "$EVENT_REF" = 'refs/heads/main' || { echo 'Deploy must run from main'; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Provide full 40-digit expected SHA'; exit 1; }
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Expected $EXPECTED_SHA but checked out $ACTUAL_SHA"; exit 1; }
          echo "Releasing reviewed main SHA: $ACTUAL_SHA"

      - name: Verify settlement and data isolation
        run: |
          node checks/domain.test.cjs
          node checks/kaixin-sync.cjs
          node checks/sync-traffic.cjs
          node checks/realtime-signal.cjs
      - name: Install CJK fonts for visual mobile QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Mobile family calendar QA (320 / 375 / 390 / 430)
        run: |
          npm install --no-save --no-package-lock playwright
          python3 -m http.server 8189 --bind 127.0.0.1 --directory dist >/tmp/kaixin-calendar-server.log 2>&1 &
          node checks/family-schedule.cjs
      - name: Upload calendar QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-calendar-mobile-qa
          path: /tmp/family-calendar-*.png
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build optimized WebP artwork
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python .github/optimize_artwork.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: build/pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
