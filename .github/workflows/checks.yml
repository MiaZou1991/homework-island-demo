name: Check Homework Island
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/p0-sync-diagnostics-recovery-20261109']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: domain-sync-and-mobile-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify settlement, sync, traffic and data isolation
        run: |
          node checks/domain.test.cjs
          node checks/kaixin-sync.cjs
          node checks/sync-diagnostics.cjs
          node checks/v2-sync-client.cjs
          node --check checks/staging-db-sync.cjs
          node checks/sync-traffic.cjs
          node checks/realtime-signal.cjs
          node checks/publish-flow.cjs
      - name: Install fonts for mobile rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Mobile family calendar QA (320 / 375 / 390 / 430)
        run: |
          npm install --no-save --no-package-lock playwright
          python3 -m http.server 8189 --bind 127.0.0.1 --directory dist >/tmp/kaixin-calendar-server.log 2>&1 &
          node checks/family-schedule.cjs
          node checks/v2-browser-idb.cjs
      - name: Build optimized WebP assets without publishing
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 .github/optimize_artwork.py
  database-contract:
    name: postgres-v2-contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaixin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaixin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client for real SQL contract checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Validate auth role checks, CAS, duplicate retries and concurrency on real Postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: kaixin_ci
          PGUSER: postgres
          PGPASSWORD: postgres
        run: node checks/postgres-v2-contract.cjs

  webkit-v2:
    name: v2-outbox-webkit-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright WebKit and dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps webkit
      - name: Verify IndexedDB outbox recovery across page reload in mobile WebKit
        run: |
          python3 -m http.server 8189 --bind 127.0.0.1 --directory dist >/tmp/kaixin-webkit-server.log 2>&1 &
          PLAYWRIGHT_BROWSER=webkit node checks/v2-browser-idb.cjs
