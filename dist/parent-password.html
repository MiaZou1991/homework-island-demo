<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://syqcpfjudjniripzcjdq.supabase.co; base-uri 'none'; form-action 'none'">
<title>开心岛 · 家长密码</title>
<style>
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5eed9;color:#393b2a;font:16px system-ui}
main{width:min(360px,calc(100% - 64px));padding:24px;background:#fffaf0;border-radius:20px}
label,input,button{display:block}input,button{box-sizing:border-box;width:100%;padding:10px;margin:8px 0 16px;font:inherit}
button{background:#d8e8b8;color:#253219;border:0;border-radius:10px}a{color:#365528}
</style>
</head>
<body>
<main>
<h1>家长密码</h1>
<p role="status" id="status">正在核对链接…</p>
<form id="request" hidden><label>家长邮箱<input type="email" name="email" autocomplete="email" required></label><button>发送设密邮件</button></form>
<form id="reset" hidden><label>新密码<input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
<label>再输入一次新密码<input type="password" name="confirmation" autocomplete="new-password" minlength="12" required></label><button>保存新密码</button></form>
<a href="./parent.html">返回家长页</a>
</main>
<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.hash.slice(1));
  let token = params.get('type') === 'recovery' ? params.get('access_token') : null;
  history.replaceState(null, '', location.pathname);
  const endpoint = 'https://syqcpfjudjniripzcjdq.supabase.co/auth/v1';
  const key = 'sb_publishable_01AzYHAiAZYmahNkiYWeog_Y5y6Emax';
  const message = document.getElementById('status');
  const request = document.getElementById('request');
  const reset = document.getElementById('reset');

  function call(path, method, body, accessToken) {
    const headers = { apikey: key, 'Content-Type': 'application/json' };
    if (accessToken) headers.Authorization = 'Bearer ' + accessToken;
    return fetch(endpoint + path, { method, headers, cache: 'no-store',
      body: body === undefined ? undefined : JSON.stringify(body) });
  }

  request.onsubmit = async event => {
    event.preventDefault();
    const button = request.querySelector('button');
    button.disabled = true;
    try {
      const destination = new URL('./parent-password.html', location.href).href;
      const result = await call('/recover?redirect_to=' + encodeURIComponent(destination), 'POST',
        { email: request.elements.email.value.trim() });
      message.textContent = result.ok ? '请检查邮箱，在同一台设备上打开新邮件里的链接。'
        : '邮件未能发送，请稍后再试。';
    } catch (_) { message.textContent = '网络未连接，请重试。'; }
    finally { button.disabled = false; }
  };

  reset.onsubmit = async event => {
    event.preventDefault();
    const button = reset.querySelector('button');
    const password = reset.elements.password.value;
    if (password !== reset.elements.confirmation.value) {
      message.textContent = '两次输入的密码不一致。';
      return;
    }
    button.disabled = true;
    try {
      const result = await call('/user', 'PUT', { password }, token);
      if (!result.ok) {
        if (result.status === 401 || result.status === 403) {
          token = null;
          reset.reset();
          reset.hidden = true;
          request.hidden = false;
        }
        message.textContent = '无法保存密码。请确认密码符合要求，或重新申请邮件。';
        return;
      }
      token = null;
      reset.reset();
      reset.hidden = true;
      message.textContent = '密码已设置。家长入口正式切换后，可使用邮箱和这个密码登录。';
    } catch (_) { message.textContent = '网络未连接，请重试。'; }
    finally { button.disabled = false; }
  };

  (async () => {
    if (token) {
      try {
        const response = await call('/user', 'GET', undefined, token);
        if (response.ok) {
          const account = await response.json();
          if (!account.is_anonymous && account.email_confirmed_at) {
            reset.hidden = false;
            message.textContent = '请输入至少 12 个字符的新密码。';
            return;
          }
        }
      } catch (_) { /* Offer a fresh email after interrupted validation. */ }
    }
    token = null;
    request.hidden = false;
    message.textContent = '输入已验证的家长邮箱，获取设密链接。';
  })();
})();
</script>
</body>
</html>
